services:
  - type: web
    name: georgie
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEORGIE_DATA_DIR
        value: /var/data
      - key: GEORGIE_AUTO_ACTION_POLICY
        value: low_risk_write
      - key: OPENAI_API_KEY
        sync: false
      - key: GEORGIE_SMARTLEAD_API_KEY
        sync: false
      - key: GEORGIE_VAPID_PUBLIC_KEY
        sync: false
      - key: GEORGIE_VAPID_PRIVATE_KEY
        sync: false
      - key: GEORGIE_VAPID_SUBJECT
        value: mailto:operations@sierracapitalfunding.com
      - key: GEORGIE_MAINTENANCE_MODE
        value: shadow
    disk:
      name: georgie-data
      mountPath: /var/data
      sizeGB: 1
