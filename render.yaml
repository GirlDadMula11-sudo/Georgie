services:
  - type: web
    name: georgie
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEORGIE_DATA_DIR
        value: /var/data
      - key: GEORGIE_AUTO_ACTION_POLICY
        value: low_risk_write
      - key: GEORGIE_RUNTIME_MODE
        value: kernel
      - key: OPENAI_API_KEY
        sync: false
      - key: GEORGIE_CONNECTOR_TOKEN
        sync: false
      - key: GEORGIE_OAUTH_CLIENT_ID
        sync: false
      - key: GEORGIE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GEORGIE_OAUTH_REDIRECT_URI
        sync: false
      - key: GEORGIE_OAUTH_ACCESS_TTL_SECONDS
        value: "3600"
      - key: GEORGIE_OAUTH_REFRESH_TTL_SECONDS
        value: "2592000"
      - key: GEORGIE_SMARTLEAD_API_KEY
        sync: false
      - key: GEORGIE_VAPID_PUBLIC_KEY
        sync: false
      - key: GEORGIE_VAPID_PRIVATE_KEY
        sync: false
      - key: GEORGIE_VAPID_SUBJECT
        value: mailto:operations@sierracapitalfunding.com
      - key: GEORGIE_MAINTENANCE_MODE
        value: shadow
      - key: GEORGIE_RECONCILIATION_MODE
        value: shadow
      - key: GEORGIE_RECONCILIATION_ENABLED
        value: "true"
      - key: GEORGIE_AUTOMATION_KILL_SWITCH
        value: "false"
      - key: GEORGIE_FINANCING_RECOVERY_ENABLED
        value: "true"
      - key: GEORGIE_FINANCING_OUTREACH_RELEASE
        value: hold
      - key: GEORGIE_FINANCING_RECOVERY_INGEST_TOKEN
        sync: false
    disk:
      name: georgie-data
      mountPath: /var/data
      sizeGB: 1
