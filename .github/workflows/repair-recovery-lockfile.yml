name: Repair Recovery Lockfile

on:
  push:
    branches:
      - repair/rehash-direct-storage-upload-20260905
    paths:
      - .github/workflows/repair-recovery-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/rehash-direct-storage-upload-20260905
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit deterministic lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize recovery parser lockfile"
          git push origin HEAD:repair/rehash-direct-storage-upload-20260905
