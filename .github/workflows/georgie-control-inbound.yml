name: Georgie Control Inbound

on:
  workflow_dispatch:
  push:
    branches:
      - georgie-control
    paths:
      - .georgie/control-signal.json

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: georgie-control-inbound
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEORGIE_INBOUND_URL: https://georgie.onrender.com/api/ai-control/inbound
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Push certified control signal to Georgie
        shell: bash
        run: |
          set -euo pipefail

          oidc_token() {
            local challenge audience encoded response
            challenge="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "$GEORGIE_INBOUND_URL/challenge")"
            audience="$(jq -er '.audience | select(type == "string" and length > 0)' <<<"$challenge")"
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$audience")"
            response="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}")"
            jq -er '.value | select(type == "string" and length > 0)' <<<"$response"
          }

          REF="${GITHUB_REF_NAME:-main}"
          SIGNAL="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.georgie/control-signal.json?ref=${REF}" --jq '.content' | tr -d '\n' | base64 --decode)"
          ISSUE="$(jq -er '.issueNumber | numbers' <<<"$SIGNAL")"
          COMMENT_ID="$(jq -er '.commentId | numbers' <<<"$SIGNAL")"
          OBJECTIVE="$(jq -er '.objectiveId | strings' <<<"$SIGNAL")"
          COMMAND="$(jq -er '.commandId | strings' <<<"$SIGNAL")"
          IDEMPOTENCY="$(jq -er '.idempotencyKey | strings' <<<"$SIGNAL")"

          [[ "$ISSUE" == "117" ]] || { echo "Control signal must target issue #117." >&2; exit 1; }
          [[ "$OBJECTIVE" == "georgie-master-closer-v1" ]] || { echo "Unexpected objective identity." >&2; exit 1; }
          [[ "$COMMAND" == "cmd_master_closer_fallback_probe_20260823" ]] || { echo "Unexpected command identity." >&2; exit 1; }
          [[ "$IDEMPOTENCY" == "master-closer-controlplane-fallback-probe-20260823-v1" ]] || { echo "Unexpected idempotency identity." >&2; exit 1; }

          COMMENT="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}")"
          AUTHOR="$(jq -r '.user.login // empty' <<<"$COMMENT")"
          BODY="$(jq -r '.body // empty' <<<"$COMMENT")"
          [[ "$AUTHOR" == "GirlDadMula11-sudo" ]] || { echo "Control comment author rejected." >&2; exit 1; }
          [[ "$BODY" == *"ai-control:v1"* ]] || { echo "Control comment marker missing." >&2; exit 1; }

          LABEL_OK="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" --jq '[.labels[].name] | index("georgie-handoff") != null')"
          [[ "$LABEL_OK" == "true" ]] || { echo "Issue #117 is missing georgie-handoff label." >&2; exit 1; }

          PAYLOAD="$(jq -c --arg repository "$GITHUB_REPOSITORY" --argjson issue "$ISSUE" '{repository:$repository, issueNumber:$issue, commentId:.id, author:.user.login, body:.body}' <<<"$COMMENT")"
          TOKEN="$(oidc_token)"
          RESPONSE="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            "$GEORGIE_INBOUND_URL/ingest")"
          jq -e '.ok == true and (.accepted | length) >= 1' <<<"$RESPONSE" >/dev/null
          echo "Georgie control push accepted."
