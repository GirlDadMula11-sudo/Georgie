name: Georgie Control Inbound

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - ".georgie/control-signal.json"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: georgie-control-inbound-${{ github.event_name == 'issue_comment' && github.event.comment.id || github.sha }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEORGIE_INBOUND_URL: https://georgie.onrender.com/api/ai-control/inbound
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Push trusted AI-control comments to Georgie
        shell: bash
        run: |
          set -euo pipefail

          oidc_token() {
            local challenge audience encoded response
            challenge="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "$GEORGIE_INBOUND_URL/challenge")"
            audience="$(jq -er '.audience | select(type == "string" and length > 0)' <<<"$challenge")"
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$audience")"
            response="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}")"
            jq -er '.value | select(type == "string" and length > 0)' <<<"$response"
          }

          send_payload() {
            local payload token response
            payload="$1"
            token="$(oidc_token)"
            response="$(curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data-binary "$payload" \
              "$GEORGIE_INBOUND_URL/ingest")"
            jq -e '.ok == true' <<<"$response" >/dev/null || {
              echo "Georgie inbound relay rejected payload: $response" >&2
              return 1
            }
            jq -c '{ok,accepted,rejected}' <<<"$response"
          }

          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            ISSUE="$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")"
            COMMENT_ID="$(jq -r '.comment.id // empty' "$GITHUB_EVENT_PATH")"
            AUTHOR="$(jq -r '.comment.user.login // empty' "$GITHUB_EVENT_PATH")"
            BODY="$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")"
            IS_PR="$(jq -r 'if .issue.pull_request then "true" else "false" end' "$GITHUB_EVENT_PATH")"
            [[ "$IS_PR" != "true" ]] || { echo "Ignoring pull-request comment."; exit 0; }
            [[ "$AUTHOR" == "GirlDadMula11-sudo" ]] || { echo "Ignoring untrusted author."; exit 0; }
            [[ "$BODY" == *"ai-control:v1"* ]] || { echo "Ignoring comment without ai-control marker."; exit 0; }
            [[ -n "$ISSUE" && -n "$COMMENT_ID" ]] || { echo "Missing issue/comment ids." >&2; exit 1; }
            LABEL_OK="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" --jq '[.labels[].name] | index("georgie-handoff") != null')"
            [[ "$LABEL_OK" == "true" ]] || { echo "Ignoring issue without georgie-handoff label."; exit 0; }
            COMMENT="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}")"
            PAYLOAD="$(jq -c --arg repository "$GITHUB_REPOSITORY" --argjson issue "$ISSUE" '{repository:$repository, issueNumber:$issue, commentId:.id, author:.user.login, body:.body}' <<<"$COMMENT")"
            send_payload "$PAYLOAD"
            echo "GitHub AI-control event fast path completed."
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            SIGNAL="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.georgie/control-signal.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"
            ISSUE="$(jq -er '.issueNumber | numbers' <<<"$SIGNAL")"
            COMMENT_ID="$(jq -er '.commentId | numbers' <<<"$SIGNAL")"
            [[ "$ISSUE" == "117" ]] || { echo "Push signal issue is not certified handoff issue #117." >&2; exit 1; }
            COMMENT="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}")"
            AUTHOR="$(jq -r '.user.login // empty' <<<"$COMMENT")"
            BODY="$(jq -r '.body // empty' <<<"$COMMENT")"
            [[ "$AUTHOR" == "GirlDadMula11-sudo" && "$BODY" == *"ai-control:v1"* ]] || { echo "Push signal does not point to a trusted AI-control comment." >&2; exit 1; }
            LABEL_OK="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" --jq '[.labels[].name] | index("georgie-handoff") != null')"
            [[ "$LABEL_OK" == "true" ]] || { echo "Push signal issue lacks georgie-handoff label." >&2; exit 1; }
            PAYLOAD="$(jq -c --arg repository "$GITHUB_REPOSITORY" --argjson issue "$ISSUE" '{repository:$repository, issueNumber:$issue, commentId:.id, author:.user.login, body:.body}' <<<"$COMMENT")"
            send_payload "$PAYLOAD"
            echo "GitHub AI-control push wake completed."
            exit 0
          fi

          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label georgie-handoff --limit 100 --json number --jq '.[].number' | while read -r ISSUE; do
            [[ -n "$ISSUE" ]] || continue
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?per_page=100" --jq '.[] | select(.user.login == "GirlDadMula11-sudo") | select((.body // "") | contains("ai-control:v1")) | @base64' | while read -r ROW; do
              [[ -n "$ROW" ]] || continue
              COMMENT="$(printf '%s' "$ROW" | base64 --decode)"
              PAYLOAD="$(jq -c --arg repository "$GITHUB_REPOSITORY" --argjson issue "$ISSUE" '{repository:$repository, issueNumber:$issue, commentId:.id, author:.user.login, body:.body}' <<<"$COMMENT")"
              send_payload "$PAYLOAD"
            done
          done
          echo "GitHub AI-control inbound recovery scan completed."
