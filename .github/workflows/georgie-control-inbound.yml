name: Georgie Control Inbound

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: georgie-control-inbound-${{ github.event_name == 'issue_comment' && github.event.comment.id || 'recovery' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEORGIE_INBOUND_URL: https://georgie.onrender.com/api/ai-control/inbound
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Push trusted AI-control comments to Georgie
        shell: bash
        run: |
          set -euo pipefail

          oidc_token() {
            local challenge audience encoded response
            challenge="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "$GEORGIE_INBOUND_URL/challenge")"
            audience="$(jq -er '.audience | select(type == "string" and length > 0)' <<<"$challenge")"
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$audience")"
            response="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}")"
            jq -er '.value | select(type == "string" and length > 0)' <<<"$response"
          }

          send_payload() {
            local payload token response
            payload="$1"
            token="$(oidc_token)"
            response="$(curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data-binary "$payload" \
              "$GEORGIE_INBOUND_URL/ingest")"
            if ! jq -e '.ok == true' <<<"$response" >/dev/null; then
              echo "Georgie inbound relay rejected payload: $response" >&2
              return 1
            fi
            jq -c '{ok,accepted,rejected}' <<<"$response"
          }

          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            ISSUE="$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")"
            COMMENT_ID="$(jq -r '.comment.id // empty' "$GITHUB_EVENT_PATH")"
            AUTHOR="$(jq -r '.comment.user.login // empty' "$GITHUB_EVENT_PATH")"
            BODY="$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")"
            IS_PR="$(jq -r 'if .issue.pull_request then "true" else "false" end' "$GITHUB_EVENT_PATH")"

            if [[ "$IS_PR" == "true" ]]; then
              echo "Ignoring pull-request comment; issue comments only."
              exit 0
            fi
            if [[ "$AUTHOR" != "GirlDadMula11-sudo" ]]; then
              echo "Ignoring comment from untrusted author: $AUTHOR"
              exit 0
            fi
            if [[ "$BODY" != *"ai-control:v1"* ]]; then
              echo "Ignoring owner comment without ai-control:v1 marker."
              exit 0
            fi
            [[ -n "$ISSUE" && -n "$COMMENT_ID" ]] || {
              echo "Missing issue/comment identifiers in GitHub event payload." >&2
              exit 1
            }

            LABEL_OK="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" \
              --jq '[.labels[].name] | index("georgie-handoff") != null')"
            [[ "$LABEL_OK" == "true" ]] || {
              echo "Ignoring AI-control comment on issue without georgie-handoff label."
              exit 0
            }

            COMMENT="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}")"
            PAYLOAD="$(jq -c \
              --arg repository "$GITHUB_REPOSITORY" \
              --argjson issue "$ISSUE" \
              '{repository:$repository, issueNumber:$issue, commentId:.id, author:.user.login, body:.body}' \
              <<<"$COMMENT")"
            send_payload "$PAYLOAD"
            echo "GitHub AI-control event fast path completed."
            exit 0
          fi

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label georgie-handoff \
            --limit 100 \
            --json number \
            --jq '.[].number' | while read -r ISSUE; do
              [[ -n "$ISSUE" ]] || continue
              gh api --paginate \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?per_page=100" \
                --jq '.[] | select(.user.login == "GirlDadMula11-sudo") | select((.body // "") | contains("ai-control:v1")) | @base64' | while read -r ROW; do
                  [[ -n "$ROW" ]] || continue
                  COMMENT="$(printf '%s' "$ROW" | base64 --decode)"
                  PAYLOAD="$(jq -c \
                    --arg repository "$GITHUB_REPOSITORY" \
                    --argjson issue "$ISSUE" \
                    '{repository:$repository, issueNumber:$issue, commentId:.id, author:.user.login, body:.body}' \
                    <<<"$COMMENT")"
                  send_payload "$PAYLOAD"
                done
            done

          echo "GitHub AI-control inbound recovery scan completed."
