name: Georgie
targets:
  Georgie:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GeorgieApp.swift
    resources:
      - path: ../public/georgie-avatar.jpg
        name: georgie-avatar.jpg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgie.native.ios
        PRODUCT_NAME: Georgie
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        INFOPLIST_KEY_CFBundleDisplayName: Georgie
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Georgie uses the microphone so you can control your assistant by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Georgie converts spoken commands into actions and assistant requests.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
