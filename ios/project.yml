name: Georgie
options:
  bundleIdPrefix: com.sierramarketinginc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Georgie:
    type: application
    platform: iOS
    sources:
      - GeorgieApp
    resources:
      - GeorgieApp/Resources
    info:
      path: GeorgieApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sierramarketinginc.georgie
        PRODUCT_NAME: Georgie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Georgie
    entitlements:
      path: GeorgieApp/Georgie.entitlements
      properties:
        com.apple.developer.siri: true
        aps-environment: development
schemes:
  Georgie:
    build:
      targets:
        Georgie: all
    run:
      config: Debug
    archive:
      config: Release
